name: build-tag-push

on:
  workflow_dispatch:

jobs:
  build-tag-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: acapileacmp2400.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        run: docker build -t final ./ACMP2400

      - name: Tag Docker image
        run: docker tag final acapileacmp2400.azurecr.io/final:latest

      - name: Push Docker image
        run: docker push acapileacmp2400.azurecr.io/final:latest
